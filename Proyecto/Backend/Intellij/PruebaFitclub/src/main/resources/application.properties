spring.application.name=PruebaFitclub

spring.datasource.url=jdbc:postgresql://localhost:5432/newfitclub
spring.datasource.username=bdfitclub
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=fitclub
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=fitclub
spring.flyway.default-schema=fitclub
spring.flyway.create-schemas=true

fitclub.reserva.limite-cancelacion-horas=2

fitclub.jwt.secret=${FITCLUB_JWT_SECRET:FitClubJwtSecretKey2026DevelopmentOnly123456789}
fitclub.jwt.expiration-ms=86400000

fitclub.admin.email=${FITCLUB_ADMIN_EMAIL:admin@fitclub.com}
fitclub.admin.password=${FITCLUB_ADMIN_PASSWORD:Admin123*}

logging.level.org.hibernate.SQL=debug

server.port=8080
